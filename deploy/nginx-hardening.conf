# Global nginx hardening for the Portfolio Builder.
# Install to /etc/nginx/conf.d/options-pricer-hardening.conf (deploy.sh does this).
#
# Lives in conf.d rather than the site file because certbot rewrites the site
# file to add HTTPS. Everything here is http-level, so it applies without
# touching that file.

# Don't advertise the nginx version in headers and error pages.
server_tokens off;

# Rate-limit the API per client IP. Only /api/ requests get a key; an empty key
# means "not limited", so static assets and the page itself are unaffected.
map $uri $options_pricer_api_client {
    ~^/api/  $binary_remote_addr;
    default  "";
}

# 10 requests/second sustained per IP, with a burst of 30 so a page load that
# fires several API calls at once never gets throttled.
limit_req_zone $options_pricer_api_client zone=options_pricer_api:10m rate=10r/s;
limit_req zone=options_pricer_api burst=30 nodelay;
limit_req_status 429;
