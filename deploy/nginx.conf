# nginx site config for finance.imaadhusoof.com
#
# Install to /etc/nginx/sites-available/options-pricer and symlink into
# sites-enabled. This is the HTTP-only version — certbot rewrites this file to
# add the TLS server block and the port-80 -> 443 redirect. Do not hand-write
# the 443 block; let certbot do it.

server {
    listen 80;
    listen [::]:80;
    server_name finance.imaadhusoof.com;

    root /opt/options-pricer/frontend/dist;
    index index.html;

    access_log /var/log/nginx/options-pricer.access.log;
    error_log  /var/log/nginx/options-pricer.error.log;

    # Uploaded payloads are tiny here; keep the ceiling low.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API -> uvicorn -----------------------------------------------------
    # Same origin as the frontend, so no CORS is involved in production.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold quote fetch can take a few seconds when the TTL has lapsed.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- Static frontend ----------------------------------------------------
    # Vite emits content-hashed filenames under /assets, so they can be cached
    # hard and forever — a new build produces new names.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users get a stale shell pointing at
    # asset filenames that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback: unknown paths hand back index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
