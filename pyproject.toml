[project]
name = "portfolio-builder-backend"
version = "0.2.0"
description = "FastAPI backend for the Portfolio Builder: cached market data plus mean-variance portfolio optimisation and Monte Carlo projections."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "pyarrow>=15.0",
]

# Treat this as an application, not an installable library, so uv doesn't
# require a build backend / package layout.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
